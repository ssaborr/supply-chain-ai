name: DevSecOps & MLSecOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # ====================================================================
  # Gate 1: Secret Detection (Shift-Left Pre-Commit Protection)
  # ====================================================================
  secret-detection:
    name: "Gate 1: Gitleaks Secret Detection"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ====================================================================
  # Gate 2: SAST & SCA (Code & Dependency Vulnerability Scanning)
  # ====================================================================
  sast-and-sca:
    name: "Gate 2: SAST (Bandit) & SCA (pip-audit / npm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install SAST & SCA Scanning Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit bandit-sarif-formatter pip-audit

      - name: Run Bandit (FastAPI Python SAST)
        run: |
          # Generate SARIF report for GitHub Security Tab (with bandit-sarif-formatter)
          bandit -r BackEnd/app -f sarif -o bandit-results.sarif --exit-zero
          # Print human-readable summary in CI logs
          bandit -r BackEnd/app -ll -f screen || true

      - name: Upload Bandit SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit-sast

      - name: Run pip-audit (Python Dependency SCA)
        run: |
          pip-audit -r BackEnd/requirements.txt --ignore-vuln PYSEC-2026-1325

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Run npm audit (Angular Dependency SCA)
        working-directory: ./FrontEnd
        run: |
          npm audit --audit-level=critical

  # ====================================================================
  # Gate 3: Automated Testing & MLSecOps AI Guardrail Verification
  # ====================================================================
  test-and-mlsecops:
    name: "Gate 3: Automated Testing & MLSecOps Guardrails"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r BackEnd/requirements.txt pytest pytest-asyncio

      - name: Run Backend Tests & MLSecOps Guardrail Suite
        working-directory: ./BackEnd
        env:
          PYTHONPATH: .
        run: |
          python -m pytest tests -v

  # ====================================================================
  # Gate 4: Containerization & Image Vulnerability Scanning (Trivy)
  # ====================================================================
  container-security:
    name: "Gate 4: Docker Build & Trivy Image Security Scan"
    runs-on: ubuntu-latest
    needs: [sast-and-sca, test-and-mlsecops]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./BackEnd
          push: false
          tags: supply-chain-backend:latest
          load: true

      - name: Scan Backend Image with Trivy (Container Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "supply-chain-backend:latest"
          format: "table"
          exit-code: "0" # Non-blocking on informational CVEs for capstone demonstration
          severity: "CRITICAL,HIGH"

      - name: Build Angular Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./FrontEnd
          push: false
          tags: supply-chain-frontend:latest
          load: true

      - name: Scan Frontend Image with Trivy (Container Security)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "supply-chain-frontend:latest"
          format: "table"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
