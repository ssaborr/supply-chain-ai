services:
  mongo:
    image: mongo:7-jammy
    container_name: supply_chain_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - supply_chain_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: supply_chain_backend
    restart: unless-stopped
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DATABASE_NAME=smart_supply_chain
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - supply_chain_net

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: supply_chain_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - supply_chain_net

volumes:
  mongo_data:

networks:
  supply_chain_net:
    driver: bridge
