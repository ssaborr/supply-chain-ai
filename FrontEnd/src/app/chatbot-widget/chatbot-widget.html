<!-- Floating Chatbot Button -->
<button class="chat-fab-button"  (click)="toggleChat()" [class.active]="isOpen" [title]="'chatbot.title' | translate">
  @if (!isOpen) {

    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fab-icon">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
    </svg>
  } @else {
    <!-- Close Icon -->
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="fab-icon">
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  }
  <span class="pulse-indicator"></span>
</button>


<div class="chat-window-popup" [class.open]="isOpen">

  <div class="chat-header">
    <div class="header-bot-info">
      <div class="bot-avatar-container">
        <!-- Robot SVG -->
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="header-bot-icon">
          <rect x="3" y="11" width="18" height="10" rx="2"></rect>
          <circle cx="12" cy="5" r="2"></circle>
          <path d="M12 7v4"></path>
          <line x1="8" y1="16" x2="8.01" y2="16"></line>
          <line x1="16" y1="16" x2="16.01" y2="16"></line>
        </svg>
        <span class="avatar-online-dot"></span>
      </div>
      <div class="header-title-wrapper">
        <h3 class="header-title">{{ 'chatbot.title' | translate }}</h3>
      </div>
    </div>
    <div class="header-actions">
      <!-- Minimize (Chevron Down) -->
      <button class="header-btn" (click)="toggleChat()" [title]="'chatbot.minimize' | translate">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="action-icon">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <!-- Options (Three Dots) -->
      <button class="header-btn" (click)="triggerOptions()" [title]="'chatbot.options' | translate">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="action-icon">
          <circle cx="12" cy="12" r="1"></circle>
          <circle cx="19" cy="12" r="1"></circle>
          <circle cx="5" cy="12" r="1"></circle>
        </svg>
      </button>
    </div>
  </div>

  <!-- Online Bar -->
  <div class="online-status-bar">
    <span class="pulsing-green-dot"></span>
    <span class="status-text">{{ 'chatbot.online' | translate }}</span>
  </div>

  <!-- Messages History -->
  <div class="chat-messages-container" #messageContainer (click)="handleMessageClick($event)">
    @for (msg of messages; track msg) {
      <div class="message-row" [class.user-row]="msg.sender === 'user'" [class.bot-row]="msg.sender === 'bot'">
        @if (msg.sender === 'bot') {
          <div class="bot-message-icon-wrapper">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="message-bot-icon">
              <rect x="3" y="11" width="18" height="10" rx="2"></rect>
              <circle cx="12" cy="5" r="2"></circle>
              <path d="M12 7v4"></path>
            </svg>
          </div>
         }
        <div class="message-bubble-wrapper">
          <div class="message-bubble" [class.user-bubble]="msg.sender === 'user'" [class.bot-bubble]="msg.sender === 'bot'">
            <div [innerHTML]="msg.text"></div>
          </div>
          <span class="message-timestamp">{{ msg.time }}</span>
        </div>
      </div>
    }

    <!-- Typing Indicator -->
    @if (isTyping) {
      <div class="message-row bot-row">
        <div class="bot-message-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="message-bot-icon">
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
          </svg>
        </div>
        <div class="message-bubble-wrapper">
          <div class="message-bubble bot-bubble typing-bubble">
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
            <span class="typing-dot"></span>
          </div>
        </div>
      </div>
    }
  </div>

  <!-- Input Area -->
  <div class="chat-input-wrapper">
    <div class="chat-input-row">
      <!-- Paperclip Icon -->
      <button class="input-action-btn" (click)="triggerAttachment()" [title]="'chatbot.attach' | translate">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="input-icon">
          <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
        </svg>
      </button>

      <!-- Input Field -->
      <input 
        type="text" 
        [(ngModel)]="userMessage" 
        (keypress)="onKeyPress($event)"
        [placeholder]="'chatbot.placeholder' | translate"
        class="chat-text-input"
      />

      <!-- Send Button -->
      <button class="send-message-btn" (click)="sendMessage()" [disabled]="!userMessage.trim()" [title]="'chatbot.send' | translate">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="send-icon">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    
    <!-- Disclaimer -->
    <div class="chat-disclaimer">
      {{ 'chatbot.disclaimer' | translate }}
    </div>
  </div>
</div>
