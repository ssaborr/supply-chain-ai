# ========================================================
# DevSecOps Hardened Nginx Reverse Proxy Configuration
# Enforces Defense-in-Depth & Modern HTTP Security Headers
# ========================================================

server {
    listen 80;
    server_name localhost;

    # --------------------------------------------------------
    # 1. DevSecOps Security Response Headers (OWASP Recommended)
    # --------------------------------------------------------
    # Prevent Clickjacking by disallowing iframe embedding
    add_header X-Frame-Options "DENY" always;

    # Prevent MIME-type sniffing vulnerabilities
    add_header X-Content-Type-Options "nosniff" always;

    # Restrict Referrer information passed to third-party domains
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Enable XSS filter in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Principle of Least Privilege: Allow camera only for local biometric login; disable audio/geo
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # Content Security Policy (CSP) to mitigate XSS and unauthorized data exfiltration
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' http://localhost:8000 http://127.0.0.1:8000 ws://localhost:4200;" always;

    # Hide Nginx server version number to prevent banner grabbing
    server_tokens off;

    # --------------------------------------------------------
    # 2. Performance: Gzip Compression
    # --------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-transform no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # --------------------------------------------------------
    # 3. Static Files: Angular Single Page Application (SPA)
    # --------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------
    # 4. Reverse Proxy: FastAPI Backend API Routing
    # --------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout defenses against slowloris attacks
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
